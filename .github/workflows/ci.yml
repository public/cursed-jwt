name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        cc: [gcc, clang]
        exclude:
          - os: macos-15
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - if: runner.os == 'macOS'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - run: make CC=${{ matrix.cc }} test-quick
      - run: make CC=${{ matrix.cc }} test-vectors
      - if: runner.os == 'Linux'
        run: make CC=${{ matrix.cc }} asan
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        run: make CC=${{ matrix.cc }} avx512

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -q -t lint -f ci/lint.Dockerfile ci
      - run: docker run --rm -e LINT_LOCAL=1 -v "$PWD":/r -w /r lint bash scripts/lint.sh

  nginx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev python3-cryptography
      - run: make -C contrib/nginx test
