name: codspeed
on:
  push:
    branches: [main]
  pull_request:
  # lets CodSpeed trigger backtest runs to build initial history
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the benchmarks
        run: |
          cmake -S bench/codspeed -B build/codspeed -DCMAKE_BUILD_TYPE=Release -DCODSPEED_MODE=simulation
          cmake --build build/codspeed -j"$(nproc)"
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: ./build/codspeed/bench_codspeed
