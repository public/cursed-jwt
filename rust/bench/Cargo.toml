[package]
name = "cursed-jwt-bench"
version = "0.0.0"
description = "criterion benchmarks: the Rust port, the C library (same process) and candidate crates"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cursed-jwt = { path = "../cursed-jwt" }
cjwt-sys = { path = "../cjwt-sys" }
hmac = "0.12"
sha2 = "0.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "hs256"
harness = false
